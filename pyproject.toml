[project]
name = "urban-heat-mitigation"
version = "0.1.0"
description = "Urban heat intelligence and mitigation platform for Delhi"
readme = "README.md"
authors = [
    { name = "Vansh Tomar", email = "vansh.tomar.0306@gmail.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "geoalchemy2>=0.20.0",
    "joblib>=1.6.0",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "scikit-learn==1.9.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
urban-heat-mitigation = "urban_heat_mitigation.main:main"
import-urban-heat-master = "urban_heat_mitigation.db.import_csv:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
